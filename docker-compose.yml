# ---- Docker Compose MVP Deployment (SQLite Persistent Volume) ----
# Service Orchestration: Django Backend, React Frontend, Nginx Proxy
#
# Usage:
#   docker compose up --build -d       # Build and run containers in background
#   docker compose down                # Stop containers (SQLite data persists in volume)
#   docker compose ps                  # Check container health status
#   docker compose logs -f backend     # Tail logs for backend container

services:
  # Django + Gunicorn Application Backend Service (SQLite persistent storage)
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: clinic-backend
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_DEBUG=False
    volumes:
      - backend_data:/app/data
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - clinic-network
    restart: unless-stopped

  # React Frontend Service (Served via Internal Nginx SPA on Port 80)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: clinic-frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - clinic-network
    restart: unless-stopped

  # Nginx Gateway Reverse Proxy Service
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: clinic-nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - clinic-network
    restart: unless-stopped

networks:
  clinic-network:
    driver: bridge

volumes:
  backend_data:
  backend_static:
  backend_media:
  backend_logs:
